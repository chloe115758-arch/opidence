<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .line { stroke: #16181D; }
    .ink { fill: #16181D; }
    .paper { fill: #FFFFFF; }
    .paper-line { stroke: #FFFFFF; }
    .hole { fill: #C9CDD2; }
    .dot { fill: #0066FF; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #F2F4F7; }
      .ink { fill: #F2F4F7; }
      .paper { fill: #16181D; }
      .paper-line { stroke: #16181D; }
      .hole { fill: #3A3F47; }
      .dot { fill: #3385FF; }
    }
  </style>
  <!-- 파비콘: 같은 그림을 절반 크기로, 선과 눈은 굵게 -->
  <g transform="scale(0.5)">
  <defs><clipPath id="above-rim"><path d="M0 0 H64 V52 H50 A20 7 0 0 1 10 52 H0 Z"/></clipPath></defs>
  <!-- 구멍 -->
  <ellipse class="hole line" cx="30" cy="52" rx="20" ry="7" stroke-width="3.6"/>
  <!-- 팔 외곽선 -->
  <path class="line" d="M42 34 C48 31 51 25 51 17" fill="none" stroke-width="11.2" stroke-linecap="round"/>
  <!-- 몸: 구멍 앞 테두리 위쪽만 보인다 -->
  <g clip-path="url(#above-rim)">
    <path class="paper line" d="M19 62 C18 46 16 28 27 21 C37 15 46 24 44 34 C43 42 40 47 40 62 Z" stroke-width="3.6" stroke-linejoin="round"/>
  </g>
  <!-- 팔 안쪽 -->
  <path class="paper-line" d="M42 34 C48 31 51 25 51 17" fill="none" stroke-width="4" stroke-linecap="round"/>
  <!-- 구멍 앞 테두리 -->
  <path class="line" d="M10 52 A20 7 0 0 0 50 52" fill="none" stroke-width="3.6" stroke-linecap="round"/>
  <!-- 눈 -->
  <circle class="ink" cx="28" cy="31" r="2.7"/>
  <circle class="ink" cx="36" cy="30" r="2.7"/>
  <!-- 근거 점 -->
  <circle class="dot" cx="52" cy="8" r="5.1"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
